<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{ page_title }}</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="page-{{ page_key }}" data-page="{{ page_key }}">
    <script>
      window.__TCCC_BOOTSTRAP__ = {{ bootstrap | tojson }};
      window.__TCCC_PAGE__ = {{ page_key | tojson }};
    </script>

    <div class="app-shell">
      <main class="dashboard">
        {% include "header.html" %}
        {% block content %}{% endblock %}
      </main>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
